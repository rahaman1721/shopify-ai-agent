[project]
name = "shopify-ai-agent"
version = "0.1.0"
description = "AI shopping assistant for Shopify stores using Gemini tool use"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.dependencies]
fastapi = ">=0.115.0"
uvicorn = { version = ">=0.32.0", extras = ["standard"] }
google-generativeai = ">=0.8.0"
httpx = ">=0.27.0"
python-dotenv = ">=1.0.0"
pydantic = ">=2.9.0"
pydantic-settings = ">=2.5.0"
slowapi = ">=0.1.9"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
